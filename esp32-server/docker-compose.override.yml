# Override do docker-compose da Nuvem (xiaozhi-esp32-server).
#
# Rodar via Justfile (define --project-directory para que os paths relativos
# do override e do base resolvam contra esp32-server/, e não contra o dir do
# base do upstream):
#   just esp32-server-up
# equivalente a:
#   docker compose --project-directory esp32-server \
#     -f esp32-server/upstream/main/xiaozhi-server/docker-compose.yml \
#     -f esp32-server/docker-compose.override.yml up -d
#
# Sem --project-directory, o `./config/config.yaml` deste override e o
# `./data`/`./models` do base resolveriam contra o dir do base do upstream
# (esp32-server/upstream/main/xiaozhi-server/), apontando para paths
# inexistentes — o Docker criaria um diretório vazio em data/.config.yaml e
# o servidor falharia ao ler a config.
#
# O que este override faz:
#  1. Monta `config/.config.yaml` (gitignored) como `data/.config.yaml`
#     dentro do contêiner — o servidor lê este arquivo e faz merge sobre o
#     config.yaml do upstream, aplicando a configuração pt-BR do Robô Felipe.
#  2. Ajusta o fuso para America/Sao_Paulo (pt-BR).
#  3. Mapeia host.docker.internal para o host, permitindo que o contêiner
#     alcance o Core (Hono) rodando no host em :3000 (ver CORE_HTTP_URL em
#     config/config.yaml).
#
# SEGREDOS: o mount abaixo usa `./config/.config.yaml` (gitignored). Copie
# `config/config.yaml` para `.config.yaml` e preencha as chaves reais lá;
# o versionado segue só com placeholders.
#
# OBS: o base ainda monta `./models/SenseVoiceSmall/model.pt` (necessário só
# para FunASR local). Como usamos GroqASR (nuvem), esse mount não afeta o
# funcionamento; se o path local não existir, o Docker cria um diretório vazio.

services:
  xiaozhi-esp32-server:
    environment:
      - TZ=America/Sao_Paulo
    # !override substitui a lista de ports do base (8000:8000/8003:8003):
    # sem isso o merge do compose acumularia as entradas em vez de trocá-las.
    # A porta WSS do host é fixa em 8091; dentro do contêiner o servidor
    # continua na 8000 (config/config.yaml não muda).
    ports: !override
      - "8091:8000"
      - "8003:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/.config.yaml:/opt/xiaozhi-esp32-server/data/.config.yaml:ro
